name: Edge Android arm64-v8a E2E

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-android-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  edge-android-e2e:
    name: Edge Canary / Android arm64-v8a
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/android/requirements.txt

      - name: Install Python E2E dependencies
        run: python -m pip install --requirement tests/android/requirements.txt

      - name: Build Edge Android extension
        run: |
          npm ci
          npm run build
          npm run verify:edge-android

      - name: Run Edge Android arm64-v8a emulator E2E
        run: python tests/android/run_edge_android_e2e.py --managed-emulator

      - name: Upload Android E2E evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: edge-android-arm64-v8a-e2e-${{ github.run_id }}
          path: artifacts/edge-android-e2e
          if-no-files-found: warn
          retention-days: 14
